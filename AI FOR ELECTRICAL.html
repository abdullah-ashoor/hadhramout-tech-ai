<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI for Electrical Engineers</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
/* Layout: engineering drawing sheet. Copper conductor accent on cool paper and ink navy. Title block footer, SLD hero. */
:root{
  --paper:#F3F4F8; --surface:#FFFFFF; --ink:#0D1530; --muted:#535E7C; --line:#CDD3E2;
  --gold:#8F5E0E; --on-gold:#FFFFFF; --cyan:#0B7FA6; --grid:rgba(13,21,48,.055); --tint:#E8EBF3; --glow:rgba(143,94,14,.11); --c1:#0B7FA6;--c2:#B3261E;--c3:#8F5E0E;--c4:#6B4BB5;--c5:#1F7A4D;--c6:#3B5BDB;--c7:#B4541A;--c8:#A3366F;
  --band-bg:#070C1F; --band-fg:#F4EBD6; --band-gold:#E2B05A; --band-cyan:#38BDF2; --band-line:#4A3A18;
  --font-d:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1024; --surface:#121A33; --ink:#EDEFF7; --muted:#9EA8C4; --line:#27325A;
  --gold:#D9A24A; --on-gold:#1A1205; --cyan:#38BDF2; --grid:rgba(237,239,247,.05); --tint:#17213F; --glow:rgba(217,162,74,.14); --c1:#38BDF2;--c2:#F2766B;--c3:#E2B05A;--c4:#A995F0;--c5:#4FD08A;--c6:#8CA6FF;--c7:#F59A5B;--c8:#EE82B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1024; --surface:#121A33; --ink:#EDEFF7; --muted:#9EA8C4; --line:#27325A;
  --gold:#D9A24A; --on-gold:#1A1205; --cyan:#38BDF2; --grid:rgba(237,239,247,.05); --tint:#17213F; --glow:rgba(217,162,74,.14); --c1:#38BDF2;--c2:#F2766B;--c3:#E2B05A;--c4:#A995F0;--c5:#4FD08A;--c6:#8CA6FF;--c7:#F59A5B;--c8:#EE82B8; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--font-b);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-stretch:112%;font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem)}
h3{font-size:1.15rem;font-stretch:104%}
p{margin:0}
.eyebrow{font:500 .72rem/1.3 var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mono{font-family:var(--font-m)}
.muted{color:var(--muted)}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto}
.logo{width:42px;height:42px;flex:none;border-radius:50%;display:block}
.brand-name{font:800 1.08rem/1 var(--font-d);font-stretch:112%;letter-spacing:.005em}
.brand-name span{color:var(--gold)}
.brand-ar{font:500 .74rem/1.4 var(--font-ar);color:var(--muted);margin-top:3px}
nav.top{display:flex;gap:4px 22px;flex-wrap:wrap}
nav.top a{font:500 .72rem/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:8px 0;border-bottom:2px solid transparent}
nav.top a:hover{color:var(--ink);border-bottom-color:var(--cyan)}
.tbtn{font:500 .72rem/1 var(--font-m);letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 12px;cursor:pointer}
.tbtn:hover{border-color:var(--gold)}


/* brand band */
.band{margin-top:28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px 36px;align-items:center;background:var(--band-bg);color:var(--band-fg);border:1px solid var(--band-gold);outline:1px solid var(--band-line);outline-offset:-7px;padding:30px 34px;border-radius:4px}
.band img{width:clamp(112px,16vw,172px);height:auto;aspect-ratio:1;display:block;border-radius:50%}
.band .ar{font:700 clamp(1.7rem,4.2vw,2.9rem)/1.3 var(--font-ar);color:var(--band-gold);direction:rtl;text-align:left}
.band .en{font:800 clamp(1rem,2.3vw,1.45rem)/1.15 var(--font-d);font-stretch:118%;letter-spacing:.16em;text-transform:uppercase;margin:6px 0 14px;overflow-wrap:anywhere}
.band .tag{font:500 1.05rem/1.6 var(--font-ar);direction:rtl;text-align:left;color:var(--band-fg)}
.band .tag2{font:500 .95rem/1.6 var(--font-ar);direction:rtl;text-align:left;color:var(--band-fg);opacity:.85}
.band .sub{font-size:.88rem;color:var(--band-fg);opacity:.82;margin-top:8px;max-width:40rem}
.band .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.band .chips span{font:500 .68rem/1 var(--font-m);letter-spacing:.16em;text-transform:uppercase;color:var(--band-cyan);border:1px solid var(--band-cyan);border-radius:2px;padding:6px 8px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:40px 56px;padding-block:56px 40px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.hero h1{font-size:clamp(2.35rem,5.6vw,4.3rem);margin:14px 0 20px}
.lede{font-size:1.1rem;max-width:34em;color:var(--ink)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-block;font:600 .9rem/1 var(--font-b);padding:14px 20px;border-radius:3px;text-decoration:none;border:1px solid var(--ink);cursor:pointer}
.btn.p{background:var(--ink);color:var(--paper)}
.btn.p:hover{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.s{background:transparent;color:var(--ink)}
.btn.s:hover{border-color:var(--gold);color:var(--gold)}
.sheet{background:var(--surface);border:1px solid var(--line);padding:16px;min-width:0}
.sheet .cap{display:flex;justify-content:space-between;gap:12px;font:500 .68rem/1.3 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
svg.sld{display:block;width:100%;height:auto;max-height:430px}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;font-size:.8rem}
.legend li{display:flex;gap:8px;align-items:baseline;min-width:0}
.legend b{font:500 .7rem var(--font-m);background:var(--gold);color:var(--on-gold);border-radius:9px;padding:1px 6px;flex:none}

/* strips and tables */
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding-block:8px 56px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .68rem/1.2 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}
td.hl{font-weight:600}
.note{font-size:.78rem;color:var(--muted);margin-top:10px}


/* motion and interaction layer */
.sheet,.bcard{position:relative}
.card{position:relative;overflow:hidden}
.card::after,.bcard::after,.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%)}
@media (hover:hover){.card:hover::after,.bcard:hover::after,.sheet:hover::after{opacity:1}}
.grid .card{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes rise{from{opacity:.25;transform:translateY(10px)}}
.marq{margin-top:18px;border-block:1px solid var(--line);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq-t{display:flex;width:max-content;animation:mq 60s linear infinite}
.marq:hover .marq-t{animation-play-state:paused}
.marq-t span{font:500 .78rem/1 var(--font-m);letter-spacing:.12em;padding:14px 22px 14px 0;white-space:nowrap;color:var(--muted)}
.marq-t span::before{content:"";display:inline-block;width:5px;height:5px;background:var(--gold);margin-right:22px;vertical-align:middle;transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}
.mk{cursor:pointer;outline:none}
.mk circle{transition:r .15s}
.mk:hover circle,.mk:focus-visible circle{r:12.5}
.mk:focus-visible circle{stroke:var(--ink);stroke-width:2}
.tip{position:absolute;max-width:calc(100% - 12px);z-index:5;pointer-events:none;background:var(--band-bg);color:var(--band-fg);border:1px solid var(--band-gold);font:500 .72rem/1.3 var(--font-m);padding:7px 9px;border-radius:3px;white-space:normal;text-align:center;width:max-content;transform:translate(-50%,-135%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.lg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:baseline;min-width:0}
.lg:hover{color:var(--gold)}
.lg:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.island{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:calc(100vw - 32px);background:var(--band-bg);color:var(--band-fg);border:1px solid var(--band-gold);border-radius:26px;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden}
.isl-main{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 18px 9px 11px;min-height:46px;cursor:pointer;width:100%}
.isl-main:focus-visible{outline:2px solid var(--band-cyan);outline-offset:-3px}
.ring{width:26px;height:26px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--band-line)}
.ring .fg{stroke:var(--band-gold);stroke-linecap:round;stroke-dasharray:62.8;stroke-dashoffset:62.8}
.isl-label{font:600 .82rem/1 var(--font-b);min-width:5.2em}
.isl-pct{font:500 .72rem/1 var(--font-m);color:var(--band-cyan);min-width:3ch;text-align:right}
.isl-menu{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:4px 12px 14px;max-width:360px}
.isl-menu a,.isl-menu button{font:500 .7rem/1 var(--font-m);letter-spacing:.09em;text-transform:uppercase;color:var(--band-fg);background:transparent;border:1px solid var(--band-line);border-radius:3px;padding:9px 10px;text-decoration:none;cursor:pointer}
.isl-menu a:hover,.isl-menu button:hover{border-color:var(--band-gold)}
.isl-menu a:focus-visible,.isl-menu button:focus-visible{outline:2px solid var(--band-cyan);outline-offset:2px}

/* sections */
section{padding-block:64px;border-top:1px solid var(--line)}
.sec-h{display:grid;gap:12px;max-width:46rem;margin-bottom:28px}
.sec-h p{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center;margin-bottom:18px}
.chip{font:500 .76rem/1 var(--font-b);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.search{margin-left:auto;min-width:min(100%,260px);font:400 .9rem var(--font-b);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.count{font:500 .72rem var(--font-m);color:var(--muted);margin:0 0 12px;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;min-width:0}
.card.open{border-color:var(--gold)}
.card-h{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:14px;cursor:pointer}
.card-h:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card-h .no{font:500 .8rem/1.3 var(--font-m);color:var(--gold);grid-row:1 / span 3}
.card-h .t{font:700 1rem/1.25 var(--font-d);font-stretch:104%}
.card-h .c{font:500 .66rem/1.3 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-h .u{font-size:.84rem;color:var(--muted);grid-column:2}
.card-h .x{font:500 1.1rem/1 var(--font-m);color:var(--gold);grid-row:1;grid-column:3}
.panel{padding:0 14px 14px;border-top:1px dashed var(--line)}
.panel h4{font:500 .66rem/1.3 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.panel ul{margin:0;padding-left:18px;font-size:.84rem}
.pr{display:flex;gap:10px;align-items:flex-start;background:var(--tint);padding:10px;margin-bottom:8px;border-radius:3px}
.pr p{font-size:.82rem;min-width:0;overflow-wrap:anywhere;flex:1}
.copy{font:500 .68rem/1 var(--font-m);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 8px;cursor:pointer;flex:none}
.copy:hover{border-color:var(--gold)}
.empty{padding:28px;border:1px dashed var(--line);color:var(--muted)}

/* inside */
.tree{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:0 24px;font-size:.9rem}
.tree div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.tree .f{font:500 .8rem/1.5 var(--font-m);color:var(--gold);overflow-wrap:anywhere}
.bonus{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.bcard{background:var(--surface);border:1px solid var(--line);padding:22px;display:grid;gap:10px;align-content:start;min-width:0}
.bcard .tag{font:500 .68rem/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.bcard p,.bcard li{font-size:.92rem}
.bcard ul{margin:0;padding-left:18px}
.pill{display:flex;flex-wrap:wrap;gap:6px}
.pill span{font:500 .72rem/1.2 var(--font-m);border:1px solid var(--line);border-radius:3px;padding:5px 7px;background:var(--tint)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:8px 40px}
ol.seq{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:0}
ol.seq li{counter-increment:s;display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.92rem}
ol.seq li::before{content:counter(s,decimal-leading-zero);font:500 .8rem/1.6 var(--font-m);color:var(--gold)}
.warn{border:1px solid var(--gold);padding:22px;display:grid;gap:8px;background:var(--surface)}
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.mail code{font:500 1rem var(--font-m);background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:3px;overflow-wrap:anywhere;user-select:all}

/* footer title block */
footer{border-top:2px solid var(--ink);padding-block:28px 110px}
.tb{display:grid;grid-template-columns:2fr 1fr 1fr 2fr;border:1px solid var(--ink);background:var(--surface)}
.tb>div{padding:12px 14px;border-right:1px solid var(--ink);min-width:0}
.tb>div:last-child{border-right:0}
.tb small{display:block;font:500 .62rem/1.2 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tb b{font:600 .92rem/1.3 var(--font-b)}
.tb .by{display:flex;align-items:center;gap:10px}
.tb .by .logo{width:30px;height:30px}
.fine{font-size:.76rem;color:var(--muted);margin-top:14px;max-width:60rem}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);padding-block:36px 24px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .tb{grid-template-columns:1fr 1fr}
  .tb>div{border-bottom:1px solid var(--ink)}
  .tb>div:nth-child(2n){border-right:0}
  .tb>div:nth-last-child(-n+2){border-bottom:0}
}
@media (max-width:560px){
  .band{grid-template-columns:minmax(0,1fr);padding:22px 18px;justify-items:start}
  .band img{width:120px}
  .bar{gap:8px 12px}
  #snd{display:none}
  nav.top{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;gap:0 20px;padding-bottom:2px}
  nav.top a{white-space:nowrap}
  .search{margin-left:0;width:100%}
  .tree{grid-template-columns:minmax(0,1fr)}
  .tree .f{border-bottom:0;padding-bottom:0}
  section{padding-block:44px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.grid .card{animation:none}.marq{overflow-x:auto;-webkit-mask-image:none;mask-image:none}.marq-t{animation:none}.mk circle,.tip{transition:none}}

/* icons, wall, live diagram */
.tile{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;color:var(--acc,var(--gold));background:var(--tint);background:color-mix(in srgb,var(--acc,var(--gold)) 13%,var(--surface));border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--acc,var(--gold)) 42%,var(--line))}
.tile .ic{width:26px;height:26px}
.ic{display:block;overflow:visible;transition:transform .25s cubic-bezier(.2,.8,.3,1.4)}
.ic .mv{transform-box:view-box}
.hv:hover .ic,.hv:focus-visible .ic{transform:translateY(-1px) scale(1.1) rotate(-3deg)}
.hv:hover .k-spin .mv,.hv:focus-visible .k-spin .mv{animation:i-spin 1s linear infinite}
.hv:hover .k-pulse .mv,.hv:focus-visible .k-pulse .mv{animation:i-pulse .7s ease-in-out infinite}
.hv:hover .k-blink .mv,.hv:focus-visible .k-blink .mv{animation:i-blink .6s steps(2,jump-none) infinite}
.hv:hover .k-flash .mv,.hv:focus-visible .k-flash .mv{animation:i-flash .8s linear infinite}
.hv:hover .k-shift .mv,.hv:focus-visible .k-shift .mv{animation:i-shift .7s ease-in-out infinite}
.hv:hover .k-lift .mv,.hv:focus-visible .k-lift .mv{animation:i-lift .7s ease-in-out infinite}
.hv:hover .k-drop .mv,.hv:focus-visible .k-drop .mv{animation:i-drop .7s ease-in-out infinite}
.hv:hover .k-swing .mv,.hv:focus-visible .k-swing .mv{animation:i-swing 1s ease-in-out infinite}
.hv:hover .k-grow .mv,.hv:focus-visible .k-grow .mv{animation:i-grow .8s ease-in-out infinite}
.hv:hover .k-write .mv,.hv:focus-visible .k-write .mv{animation:i-write .8s ease-in-out infinite}
.hv:hover .k-flow .mv,.hv:focus-visible .k-flow .mv{stroke-dasharray:3 2.5;animation:i-flow .45s linear infinite}
@keyframes i-spin{to{transform:rotate(360deg)}}
@keyframes i-pulse{50%{transform:scale(1.2)}}
@keyframes i-blink{50%{opacity:.15}}
@keyframes i-flash{0%,100%{opacity:1}15%{opacity:.1}30%{opacity:1;transform:scale(1.12)}50%{opacity:.25}70%{opacity:1}}
@keyframes i-shift{50%{transform:translateX(2px)}}
@keyframes i-lift{50%{transform:translateY(-2.2px)}}
@keyframes i-drop{50%{transform:translateY(2.4px)}}
@keyframes i-swing{25%{transform:rotate(-24deg)}75%{transform:rotate(24deg)}}
@keyframes i-grow{50%{transform:scaleY(.5)}}
@keyframes i-write{25%{transform:translate(-2px,1.2px)}75%{transform:translate(1.4px,-1.2px)}}
@keyframes i-flow{to{stroke-dashoffset:-11}}
[data-c="1"]{--acc:var(--c1)}[data-c="2"]{--acc:var(--c2)}[data-c="3"]{--acc:var(--c3)}[data-c="4"]{--acc:var(--c4)}
[data-c="5"]{--acc:var(--c5)}[data-c="6"]{--acc:var(--c6)}[data-c="7"]{--acc:var(--c7)}[data-c="8"]{--acc:var(--c8)}
.card{border-top:3px solid var(--acc,var(--gold))}
.card.open{border-color:var(--acc,var(--gold))}
.card-h .tile{grid-column:1;grid-row:1 / span 3;align-self:start}
.card-h .t{grid-column:2;grid-row:1}.card-h .x{grid-column:3;grid-row:1;color:var(--acc,var(--gold))}
.card-h .c{grid-column:2;grid-row:2;color:var(--acc,var(--muted));font-weight:500}.card-h .u{grid-column:2;grid-row:3}
.card-h:hover .tile{border-color:var(--acc,var(--gold))}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tl{all:unset;box-sizing:border-box;position:relative;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--acc);transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.tl .ic{width:54%;height:54%}
.tl .n{position:absolute;left:6px;top:4px;font:500 .62rem/1 var(--font-m);color:var(--muted)}
.tl:hover,.tl:focus-visible{transform:translateY(-3px);border-color:var(--acc);background:var(--tint);background:color-mix(in srgb,var(--acc) 12%,var(--surface));box-shadow:0 6px 16px rgba(0,0,0,.14)}
.tl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wallcap{min-height:1.7em;margin:12px 0 4px;font:500 .8rem/1.4 var(--font-m);color:var(--muted)}
.catkey{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem}
.catkey li{display:flex;align-items:center;gap:6px}
.catkey i{width:10px;height:10px;border-radius:3px;background:var(--acc)}
.sheet.live{--surface:#0D1530;--ink:#EAF0FF;--muted:#93A6DA;--line:#26335E;--gold:#E2B05A;--on-gold:#0A1024;--glow:rgba(56,189,242,.16);background:#0D1530;border-color:#26335E;color:#EAF0FF}
.sld .fl{stroke:#38BDF2;stroke-width:2.6;stroke-dasharray:2 12}
.sld .fl.dn{animation:fl-f 1s linear infinite}
.sld .fl.up{animation:fl-f 1s linear infinite}
@keyframes fl-f{to{stroke-dashoffset:-14}}
.sld .busrun{stroke:#38BDF2;stroke-width:5;stroke-dasharray:10 90;stroke-linecap:butt;opacity:.8;animation:busrun 3.2s linear infinite}
@keyframes busrun{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.sld .wave{stroke-dasharray:4 3;animation:wv .8s linear infinite}
@keyframes wv{to{stroke-dashoffset:-14}}
.sld .tr{animation:trp 2.4s ease-in-out infinite}.sld .t2{animation-delay:.6s}
@keyframes trp{50%{stroke:#E2B05A}}
.sld .mring,.sld .sunr{transform-box:fill-box;transform-origin:center;animation:sldspin 3s linear infinite}
.sld .sunr{animation-duration:9s}
@keyframes sldspin{to{transform:rotate(360deg)}}
.sld .p1{animation:chg 1.6s ease-in-out infinite}.sld .p2{animation:chg 1.6s ease-in-out infinite .8s}
@keyframes chg{0%,100%{stroke:var(--ink);opacity:1}50%{stroke:#38BDF2;opacity:.45}}
.sld .pvb{animation:pvp 2.6s ease-in-out infinite}
@keyframes pvp{50%{stroke:#E2B05A}}
.sld .bl{animation:bch 2.4s ease-in-out infinite}
.sld .b1{animation-delay:0s}.sld .b2{animation-delay:.3s}.sld .b3{animation-delay:.6s}.sld .b4{animation-delay:.9s}
@keyframes bch{0%,15%{opacity:.2}45%,100%{opacity:1}}
.sld .rg{fill:none;stroke:var(--gold);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:rg 2.4s ease-out infinite}
@keyframes rg{from{transform:scale(1);opacity:.75}to{transform:scale(1.9);opacity:0}}
.sld .mk:hover circle:not(.rg),.sld .mk:focus-visible circle:not(.rg){r:12.5}
.sld.fault .fl{stroke:#FF6B5E;animation-duration:.25s}
.sld.fault .busrun{stroke:#FF6B5E;animation-duration:.6s;opacity:1}
.sld.fault .bus{stroke:#FF6B5E}
.sld.trip .fl,.sld.trip .busrun{opacity:0}
.sld.trip .brk{fill:#FF6B5E;stroke:#FF6B5E}
.sld.trip .bus{stroke:#6C7AA8}
.fltrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;font:400 .72rem/1.3 var(--font-m);color:var(--muted)}
.fbtn{font:500 .72rem/1 var(--font-m);letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--gold);border-radius:3px;padding:10px 12px;cursor:pointer;min-height:40px}
.fbtn:hover{background:var(--gold);color:var(--on-gold)}
.fbtn:focus-visible{outline:2px solid #38BDF2;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .ic,.tl{transition:none}
  .hv:hover .mv,.hv:focus-visible .mv{animation:none!important}
  .sld .fl,.sld .busrun,.sld .wave,.sld .tr,.sld .mring,.sld .sunr,.sld .p1,.sld .p2,.sld .pvb,.sld .bl,.sld .rg{animation:none!important}
  .sld .busrun{opacity:0}
}
</style>


<style>
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 0}
#gate .gbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);padding:28px 24px;text-align:center}
#gate img{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:block}
#gate h1{font:800 1.35rem/1.2 var(--font-d);font-stretch:108%;margin:0 0 2px}
#gate .ar{font:500 .95rem/1.6 var(--font-ar);color:var(--muted);margin:0 0 14px}
#gate p.h{font-size:.9rem;color:var(--muted);margin:0 0 16px}
#gate #gform{display:grid;gap:10px}
#gate input{font:400 1rem/1.2 var(--font-m);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:13px 12px;width:100%;min-height:46px}
#gate input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gate button{font:600 .8rem/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:3px;padding:14px;cursor:pointer;min-height:46px}
#gate button:disabled{opacity:.6;cursor:wait}
#gate .err{min-height:1.4em;font:500 .8rem/1.4 var(--font-m);color:#C0392B;margin:2px 0 0}
</style>

</head>
